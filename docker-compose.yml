name: xzdp
services:
  mysql:
    image: mysql:8.4
    mem_limit: 512m
    command: [--innodb-buffer-pool-size=96M, --max-connections=40, --performance-schema=OFF]
    environment:
      MYSQL_DATABASE: xzdp
      MYSQL_USER: xzdp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xzdp-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xzdp-local-root}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./resources/xzdp.sql:/docker-entrypoint-initdb.d/10-xzdp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u xzdp xzdp -e 'SELECT id FROM tb_voucher_order LIMIT 1'"]
      interval: 5s
      timeout: 4s
      retries: 40
  redis:
    image: redis:7.4-alpine
    mem_limit: 128m
    command: [redis-server, --appendonly, "yes", --maxmemory, 80mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
  api:
    build: .
    mem_limit: 192m
    environment:
      XZDP_MYSQL_DSN: "xzdp:${MYSQL_PASSWORD:-xzdp-local}@tcp(mysql:3306)/xzdp?parseTime=true&charset=utf8mb4&timeout=3s"
      XZDP_REDIS_ADDRESS: redis:6379
      GOMEMLIMIT: 144MiB
    ports: ["127.0.0.1:${API_PORT:-8081}:8081"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8081/health/ready]
      interval: 5s
      timeout: 3s
      retries: 15
  prometheus:
    image: prom/prometheus:v3.16.0
    mem_limit: 256m
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=2d, --storage.tsdb.retention.size=256MB]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
  grafana:
    image: grafana/grafana:12.3.0
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes: [./deploy/grafana/provisioning:/etc/grafana/provisioning:ro, grafana-data:/var/lib/grafana]
volumes:
  mysql-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
