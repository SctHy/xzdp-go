name: xzdp
x-runtime: &runtime
  DATABASE_URL: postgres://xzdp:${POSTGRES_PASSWORD:-xzdp}@postgres:5432/xzdp?sslmode=disable
  KAFKA_TOPIC: ${KAFKA_TOPIC:-xzdp.seckill.orders}
  KAFKA_RECONCILE_AGE: ${KAFKA_RECONCILE_AGE:-5s}
  KAFKA_BROKERS: kafka:29092
  REDIS_URL: redis://redis:6379/0
  DEMO_DATA: "true"
  STOCK_BUCKETS: ${STOCK_BUCKETS:-1}
services:
  postgres:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: xzdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xzdp}
      POSTGRES_DB: xzdp
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xzdp"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.8.4
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:29092, --list]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      <<: *runtime
      MOCK_PAYMENT: ${MOCK_PAYMENT:-false}
      DEMO_CODES: ${DEMO_CODES:-false}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      XZDP_SMTP_ADDRESS: ${XZDP_SMTP_ADDRESS:-}
      XZDP_SMTP_FROM: ${XZDP_SMTP_FROM:-}
      XZDP_SMTP_USER: ${XZDP_SMTP_USER:-}
      XZDP_SMTP_PASSWORD: ${XZDP_SMTP_PASSWORD:-}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 3s
      retries: 5
    ports: ["127.0.0.1:8081:8080"]
    depends_on: &deps
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    stop_grace_period: 45s
    build: .
    command: [/app/worker]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8082/readyz]
      interval: 10s
      timeout: 3s
      retries: 5
    environment: *runtime
    depends_on: *deps
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
volumes:
  kafka_data:
  postgres-data:
  redis-data:
