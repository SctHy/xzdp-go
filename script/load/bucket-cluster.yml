services:
  cluster:
    image: redis:7.4-alpine
    network_mode: none
    mem_limit: 256m
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        for port in 7000 7001 7002; do
          mkdir -p /tmp/node-$$port
          redis-server --port $$port --dir /tmp/node-$$port --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --bind 127.0.0.1 --save '' --appendonly no --daemonize yes
        done
        redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-yes
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL","redis-cli -p 7000 cluster info | grep -q cluster_state:ok"]
      interval: 1s
      retries: 30
